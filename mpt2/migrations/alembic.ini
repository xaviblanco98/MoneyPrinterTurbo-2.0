# Alembic configuration for mpt2. The script location and database URL are
# always injected programmatically by mpt2.db.alembic_config(); values here are
# defaults for running the alembic CLI by hand from this directory.
[alembic]
script_location = %(here)s
sqlalchemy.url = sqlite:///../../storage/mpt2/mpt2.sqlite3
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = ../..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
